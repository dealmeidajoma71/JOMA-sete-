<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar Conta - RJ7</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<header class="header">

    <div class="logo">
        <img src="../images/logo/logo-rj7.png" alt="RJ7">
    </div>

</header>



<main class="account-page">


<div class="account-box">


<h1>
Criar Conta
</h1>


<form>


<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
    type="text"
    id="full_name"
    placeholder="Nome completo"
    required
>

</div>



<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
    type="email"
    id="email"
    placeholder="Email"
    required
>

</div>

<div class="input-box">
    <i class="fa-solid fa-phone"></i>

    <input
        type="tel"
        id="phone"
        placeholder="Telefone"
        required
    >
</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
    type="password"
    id="password"
    placeholder="Palavra-passe"
    required
>

</div>



<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input type="password" id="confirm_password" placeholder="Confirmar palavra-passe" required>

</div>



<button type="submit" class="register-btn">
    Criar Conta
</button>


</form>


<p>
Já tens uma conta?
<a href="login.html">
Entrar
</a>
</p>


</div>


</main>

<footer class="footer">

    <div class="footer-container">

        <div class="footer-brand">
            <h3>Right Joma 7</h3>
            <p>Moda, estilo e qualidade.</p>
        </div>


        <div class="footer-links">

            <h4>Links</h4>

            <a href="index.html">Home</a>
            <a href="shop.html">Loja</a>
            <a href="favorites.html">Favoritos</a>
            <a href="cart.html">Carrinho</a>

        </div>


        <div class="footer-social">

            <h4>Redes Sociais</h4>

            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">YouTube</a>
            <a href="#">TikTok</a>

        </div>

    </div>


    <div class="footer-bottom">

        <p>© 2026 Right Joma 7. Todos os direitos reservados.</p>

    </div>

</footer>
<script type="module" src="../js/auth.js"></script>
</body>

</html>
