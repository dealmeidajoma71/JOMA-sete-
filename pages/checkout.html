<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | RIGHTJOMA7</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<header class="header">

    <div class="logo">

        <img src="../images/logo/logo-rj7.png" alt="RJ7">

    </div>


</header>



<main>


<section class="checkout-section">


<h1>
Finalizar Compra
</h1>



<form id="checkoutForm">


<input 
type="text" 
id="customerName"
placeholder="Nome completo"
required>



<input 
type="tel" 
id="customerPhone"
placeholder="Telefone"
required>



<input 
type="text" 
id="customerAddress"
placeholder="Endereço de entrega"
required>



<div id="checkoutItems">

</div>



<h2 id="checkoutTotal">
Total: 0 Kz
</h2>



<button type="submit">

Continuar

</button>



</form>


</section>


</main>



<script type="module" src="../js/script.js"></script>


</body>

</html>
