<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | RIGHTJOMA7</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<header class="header">

    <div class="logo">

        <img src="../images/logo/logo-rj7.png" alt="RJ7">

    </div>


</header>



<main>


<section class="checkout-section">


<h1>
Finalizar Compra
</h1>



<form id="checkoutForm">


<input 
type="text" 
id="customerName"
placeholder="Nome completo"
required>


<select
    id="deliveryCountry"
    required
>
    <option value="">País de entrega</option>
    <option value="AO">🇦🇴 Angola</option>
    <option value="NA">🇳🇦 Namíbia</option>
</select>


<input 
type="tel" 
id="customerPhone"
placeholder="Telefone"
required>



<select
    id="deliveryProvince"
    required
>
    <option value="">Província / Região</option>
</select>

<select
    id="deliveryCity"
    required
    disabled
>
    <option value="">Cidade / Zona de entrega</option>
</select>

<input
    type="hidden"
    id="customerAddress"
    value=""
>



<div id="checkoutItems">

</div>



<h2 id="checkoutTotal">
Total: 0 Kz
</h2>



<button type="submit">

Continuar

</button>



</form>


</section>


</main>



<script type="module" src="../js/script.js"></script>


</body>

</html>
