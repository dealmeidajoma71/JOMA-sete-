<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detalhes da Encomenda - RJ7</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<header class="header">

    <div class="logo">

        <img
            src="../images/logo/logo-rj7.png"
            alt="RJ7"
        >

    </div>

</header>



<main class="dashboard-page">


    <div class="dashboard-card">


        <div class="profile-top">

            <i
                class="fa-solid fa-box"
                style="
                    font-size:55px;
                    color:#d4af37;
                    margin-bottom:15px;
                "
            ></i>


            <h2>
                Detalhes da Encomenda
            </h2>


            <p id="order-number">
                A carregar...
            </p>

        </div>



        <div id="order-details">

            <p>
                A carregar detalhes da encomenda...
            </p>

        </div>



        <div style="margin-top:25px;">

            <a
                href="orders.html"
                class="btn"
                style="
                    display:block;
                    text-align:center;
                    text-decoration:none;
                "
            >

                <i class="fa-solid fa-arrow-left"></i>

                Voltar às Encomendas

            </a>

        </div>


    </div>


</main>



<script
    type="module"
    src="../js/auth-guard.js"
></script>


<script
    type="module"
    src="../js/order-details.js"
></script>


</body>

</html>
