<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Endereços - RJ7</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <img src="../images/logo/logo-rj7.png" alt="RJ7">
    </div>

</header>


<main class="dashboard-page">

    <div class="dashboard-card">

        <div class="profile-top">

            <i class="fa-solid fa-location-dot"
               style="font-size:55px;color:#d4af37;margin-bottom:15px;"></i>

            <h2>Meus Endereços</h2>

            <p>Adiciona e guarda os teus endereços de entrega.</p>

        </div>


        <form id="address-form">

            <div class="input-box">

                <input
                    type="text"
                    id="full_name"
                    placeholder="Nome completo"
                    required>

            </div>


            <div class="input-box">

                <input
                    type="text"
                    id="phone"
                    placeholder="Telefone"
                    required>

            </div>


            <div class="input-box">

                <input
                    type="text"
                    id="address"
                    placeholder="Endereço completo"
                    required>

            </div>


            <button type="submit" class="btn">
                Guardar Endereço
            </button>

        </form>


        <div id="addresses-list"></div>

    </div>

</main>

<script type="module" src="../js/auth-guard.js"></script>
<script type="module" src="../js/addresses.js"></script>

</body>

</html>
