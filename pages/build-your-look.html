<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Build Your Look — RJ7</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- TOPO -->
    <header class="rj7-build-header">

        <a href="index.html" class="rj7-logo">
           <img src="../images/logo/logo-rj7.png" alt="RJ7">
        </a>

        <a href="shop.html" class="rj7-shop-link">
            Shop
        </a>

    </header>


    <!-- BUILD YOUR LOOK -->
    <main class="rj7-build-page">

        <section class="rj7-build-hero">

            <span>
                RJ7 STYLE SYSTEM
            </span>

            <h1>
                BUILD YOUR LOOK
            </h1>

            <p>
                Escolhe o teu estilo e descobre
                peças RJ7 selecionadas para ti.
            </p>

        </section>


        <!-- ESTILOS -->
        <section
            class="rj7-build-styles"
            id="rj7BuildStyles"
        >

            <button
                type="button"
                class="rj7-build-style"
                data-style="casual"
            >
                Casual
            </button>

            <button
                type="button"
                class="rj7-build-style"
                data-style="sport"
            >
                Sport
            </button>

            <button
                type="button"
                class="rj7-build-style"
                data-style="premium"
            >
                Premium
            </button>

            <button
                type="button"
                class="rj7-build-style"
                data-style="minimal"
            >
                Minimal
            </button>

            <button
                type="button"
                class="rj7-build-style"
                data-style="night"
            >
                Night
            </button>

            <button
                type="button"
                class="rj7-build-style"
                data-style="everyday"
            >
                Everyday
            </button>

        </section>


        <!-- RESULTADOS -->
        <section
            id="rj7BuildResults"
            class="rj7-build-results"
        >

        </section>

    </main>
<!-- ======================================================
     RJ7 BUILD YOUR LOOK — NOVA COLEÇÃO VISUAL
     ====================================================== -->

<section class="rj7-byl-gallery-section">

    <div class="rj7-byl-heading">

        <span>RJ7 STYLE SYSTEM</span>

        <h1>
            BUILD<br>
            YOUR LOOK.
        </h1>

        <p>
            Descobre as peças que combinam
            com o teu estilo.
        </p>

    </div>


    <div
        id="rj7BuildLookProducts"
        class="rj7-byl-products-grid"
    ></div>

</section>

<script type="module" src="../js/build-your-look.js"></script>
<script type="module" src="../js/account-floating-button.js"></script>
</body>

</html>
